[project]
name = "rag-demo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "litellm>=1.90.2",
    "numpy>=2.4.6",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# evaluate.py lives at the repo root, not inside src/rag -- this puts the
# root on sys.path so tests/test_quality.py can import it directly instead
# of duplicating its metric logic.
pythonpath = ["."]
markers = [
    "quality: exercises the live pipeline + LLM judge against the golden set; costs real API calls, not for fast local runs",
]
# "quality" tests cost real API calls and take minutes -- excluded from a
# bare `pytest` invocation so it stays fast/free by default. Run them
# explicitly with `pytest -m quality` (e.g. in CI).
addopts = "-m 'not quality'"

[tool.ruff]
line-length = 100
target-version = "py311"
